name: Auto Labeler

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-26.04
    steps:
      # 이슈/PR 제목을 .github/labeler.yml 규칙과 비교해 라벨을 자동으로 붙인다
      - name: Apply labels
        uses: hoho4190/issue-pr-labeler@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file-path: labeler.yml
